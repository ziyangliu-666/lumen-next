# The staging database: one Fly machine running the official Postgres image
# with a 1 GB volume, reachable only on the private network as
# lumen-next-staging-db.internal:5432. Not Fly's managed Postgres: staging
# holds nothing worth a managed service, and this costs a few cents a day.
#
#   flyctl deploy --config deploy/fly/postgres.toml
#
# POSTGRES_PASSWORD is a secret on the app, set once with flyctl secrets set.
app = "lumen-next-staging-db"
primary_region = "sin"

[build]
  image = "postgres:17"

[env]
  POSTGRES_USER = "lumen"
  POSTGRES_DB = "lumen"
  PGDATA = "/var/lib/postgresql/data/pgdata"

[mounts]
  source = "pgdata"
  destination = "/var/lib/postgresql/data"

# No [http_service] and no [[services]]: nothing is published outside the
# private network. The app reaches it by its .internal name.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[checks]
  [checks.ready]
    type = "tcp"
    port = 5432
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
