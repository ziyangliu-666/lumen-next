name: Copilot review

# The ruleset's automatic Copilot review only fires when the pull request's
# author holds a Copilot seat. A teammate without one would get no review. This
# job requests Copilot on their behalf with a token from an account that has a
# seat, so every pull request is reviewed against .github/copilot-instructions.md
# and the review is charged to that account's quota.
#
# Secret: COPILOT_REVIEW_TOKEN, a fine-grained personal access token scoped to
# this repository with "Pull requests: read and write".
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  request:
    # The ruleset already covers the seat holder's own pull requests.
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'ziyangliu-666'
    runs-on: ubuntu-latest
    steps:
      - name: Request a Copilot review
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "COPILOT_REVIEW_TOKEN is not set; skipping." && exit 0
          fi
          gh api -X POST "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]' >/dev/null
