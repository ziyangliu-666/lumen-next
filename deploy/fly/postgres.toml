# The staging database: postgres:17 on one Fly machine with a 1 GB volume,
# reachable on the private network as lumen-next-staging-db.internal:5432.
#
#   flyctl deploy --config deploy/fly/postgres.toml
app = "lumen-next-staging-db"
primary_region = "sin"

[build]
  image = "postgres:17"

[env]
  POSTGRES_USER = "lumen"
  POSTGRES_DB = "lumen"
  PGDATA = "/var/lib/postgresql/data/pgdata"

[mounts]
  source = "pgdata"
  destination = "/var/lib/postgresql/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[checks]
  [checks.ready]
    type = "tcp"
    port = 5432
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
