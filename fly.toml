# Hosted staging on Fly.io: the same image the Deploy workflow builds and
# scans, on one small machine that stops when idle. Postgres is the machine in
# deploy/fly/postgres.toml, reached over the private network.
#
#   flyctl deploy --remote-only
#
# Secrets (set once with flyctl secrets set, never in this file): DATABASE_URL,
# OPENAI_API_KEY, and the OAuth client pairs when identity hands them over.
app = "lumen-next-staging"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  LUMEN_PORT = "4000"
  LUMEN_ORIGIN = "https://lumen-next-staging.fly.dev"
  LUMEN_LOG_LEVEL = "info"
  IDENTITY_SESSION_LIFETIME_MS = "86400000"
  IDENTITY_INSECURE_COOKIES = "false"
  LUMEN_MODEL_PROVIDER = "openai"
  LUMEN_DEMO_PACE_MS = "300"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
