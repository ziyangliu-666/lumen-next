name: Platform deploy

# The ASS demonstration (docs/platform/contract.md, "Public deployment"):
# every push to ass/platform is a deployment to the k3s host (Vultr or AWS).
#
# There is no registry. The runner builds the image, copies it to the host
# over SSH and imports it into k3s containerd. The chart never pulls it.
#
# The DevSecOps stages, in order:
#   verify, sca, sast   in parallel; all three gate the deploy
#   deploy              build, Trivy image scan, copy, helm upgrade, health
#   dast, smoke-load    in parallel, against the public URL the deploy made
#   summary             one line per stage in the run summary
on:
  push:
    branches: [ass/platform]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/k8s/**'
      - 'Dockerfile'
      - 'package-lock.json'
      - '.github/workflows/platform-deploy.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker mode: auto lets the chart choose (steering if a model key is set)'
        required: false
        default: auto
        type: choice
        options: [auto, demo, steering]

# One host, one release: a second deploy waits for the first, and a deploy in
# progress is never cancelled half-way through a helm upgrade.
concurrency:
  group: platform-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The same gate as ci.yml: the database tests skip without DATABASE_URL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
          POSTGRES_DB: lumen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lumen:lumen@localhost:5432/lumen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage
        run: npm run test:cov

  sca:
    name: SCA - dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only what ships in the image: a dev-only advisory does not reach the host.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # a private repository needs this for the upload step
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      # As in security.yml: code scanning upload needs GitHub Code Security,
      # which a private repository does not have. The SARIF is an artifact.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: sarif-results
      - name: Keep the SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results

  deploy:
    needs: [verify, sca, sast]
    runs-on: ubuntu-latest
    # dast and smoke-load test the release this job made, at this address.
    outputs:
      host: ${{ steps.host.outputs.name }}
      worker: ${{ steps.worker.outputs.mode }}
      image_scan: ${{ steps.trivy-gate.outcome }}
    env:
      SHA: ${{ github.sha }}
      SSH_HOST: ${{ secrets.PLATFORM_SSH_HOST }}
      SSH_KEY_FILE: ${{ github.workspace }}/../platform-ssh-key
      REMOTE_DIR: lumen-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/k8s/Dockerfile -t "lumen-next:$SHA" .

      # The scan runs before the copy, so a vulnerable image never reaches
      # the host. Two passes: the first reports, the second gates.
      - name: Image scan report (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lumen-next:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          output: trivy-image.txt
          exit-code: '0'

      - name: Image scan in the summary
        if: always()
        run: |
          {
            echo '### Image scan (Trivy, HIGH and CRITICAL)'
            echo
            echo '```'
            cat trivy-image.txt 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the image scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.txt
          if-no-files-found: ignore

      # Fail only on what the team can fix now: a CRITICAL with no fixed
      # version would block every deploy and give nothing to do.
      - name: Image scan gate (CRITICAL with a fix)
        id: trivy-gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lumen-next:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      - name: Save image
        run: docker save "lumen-next:$SHA" | gzip > lumen-next.tar.gz

      - name: Public host name
        id: host
        # sslip.io resolves lumen.1-2-3-4.sslip.io to 1.2.3.4: a stable name
        # without buying a domain.
        run: echo "name=lumen.${SSH_HOST//./-}.sslip.io" >> "$GITHUB_OUTPUT"

      - name: Effective worker mode
        id: worker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKER_MODE: ${{ inputs.worker }}
        # The same choice the chart makes (see Helm upgrade): auto means
        # steering when a model key is set. smoke-load runs only in demo mode,
        # because a steering worker calls a paid model.
        run: |
          if [ -n "$WORKER_MODE" ] && [ "$WORKER_MODE" != auto ]; then
            mode="$WORKER_MODE"
          elif [ -n "$OPENAI_API_KEY" ]; then
            mode=steering
          else
            mode=demo
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: SSH key and host key
        env:
          SSH_KEY: ${{ secrets.PLATFORM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$SSH_KEY_FILE"
          printf '%s\n' "$SSH_KEY" > "$SSH_KEY_FILE"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # The host may still be booting after a stop and start: try a few times.
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            if [ "$attempt" = 5 ]; then echo 'ssh-keyscan failed'; exit 1; fi
            sleep 10
          done

      - name: Copy the image and the chart
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_FILE" "ubuntu@$SSH_HOST" "rm -rf $REMOTE_DIR && mkdir -p $REMOTE_DIR/deploy"
          scp -i "$SSH_KEY_FILE" lumen-next.tar.gz "ubuntu@$SSH_HOST:$REMOTE_DIR/"
          scp -i "$SSH_KEY_FILE" -r deploy/k8s "ubuntu@$SSH_HOST:$REMOTE_DIR/deploy/"

      - name: Import the image into k3s
        run: |
          ssh -i "$SSH_KEY_FILE" "ubuntu@$SSH_HOST" \
            "set -euo pipefail; gunzip -c $REMOTE_DIR/lumen-next.tar.gz | sudo k3s ctr images import -; rm -f $REMOTE_DIR/lumen-next.tar.gz"

      - name: Helm upgrade
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKER_MODE: ${{ inputs.worker }}
          HOST_NAME: ${{ steps.host.outputs.name }}
        # The command goes to the host on stdin, not on the ssh command line,
        # so the optional key never appears in this log or in the runner's
        # process list. printf %q quotes each value for the remote shell.
        run: |
          set -euo pipefail
          args=(--set "ingress.host=$HOST_NAME" --set "image.tag=$SHA")
          if [ -n "$OPENAI_API_KEY" ]; then
            args+=(--set-string "extraSecrets.OPENAI_API_KEY=$OPENAI_API_KEY")
            args+=(--set-string "extraSecrets.LUMEN_MODEL_PROVIDER=openai")
            # gpt-4.1-nano is deprecated (OpenAI returns 404); mini is the default.
            args+=(--set-string "extraSecrets.LUMEN_MODEL=gpt-4.1-mini")
          fi
          # config.worker "" lets the chart choose: steering when a model key
          # is set, demo otherwise. Force demo for a load test that costs nothing.
          # A push has no inputs: WORKER_MODE is empty, the same as auto.
          if [ -n "$WORKER_MODE" ] && [ "$WORKER_MODE" != auto ]; then
            args+=(--set-string "config.worker=$WORKER_MODE")
          fi
          {
            echo 'set -euo pipefail'
            echo "cd $REMOTE_DIR"
            echo 'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml'
            printf 'helm upgrade --install lumen deploy/k8s/lumen -n lumen --create-namespace'
            printf ' -f deploy/k8s/public/values.yaml --wait --timeout 10m'
            printf ' %q' "${args[@]}"
            echo
          } | ssh -i "$SSH_KEY_FILE" "ubuntu@$SSH_HOST" bash -s

      - name: Prune old images on the host
        # Keep the disk (20 GB) from filling with one image per commit.
        run: |
          ssh -i "$SSH_KEY_FILE" "ubuntu@$SSH_HOST" \
            "sudo k3s ctr images ls -q | grep '/lumen-next:' | grep -v ':$SHA\$' | xargs -r sudo k3s ctr images rm"

      - name: Wait for the public address
        env:
          HOST_NAME: ${{ steps.host.outputs.name }}
        # cert-manager can take a minute to get the first certificate. While
        # it does, the HTTP answer shows that the Ingress is up; only an HTTPS
        # 200 with a valid certificate counts as success.
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$HOST_NAME/api/health" || true)
            if [ "$code" = 200 ]; then
              echo "https://$HOST_NAME/api/health answered 200"
              exit 0
            fi
            plain=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "http://$HOST_NAME/api/health" || true)
            echo "https: ${code:-none}, http: ${plain:-none}; waiting"
            sleep 10
          done
          echo "https://$HOST_NAME/api/health did not answer 200 in 3 minutes"
          exit 1

      - name: Cluster state, when something went wrong
        if: failure()
        run: |
          ssh -i "$SSH_KEY_FILE" "ubuntu@$SSH_HOST" \
            "sudo k3s kubectl get pods,svc,ingress,certificate -n lumen; sudo k3s kubectl get events -n lumen --sort-by=.lastTimestamp | tail -30" || true

      - name: Remove the SSH key
        if: always()
        run: rm -f "$SSH_KEY_FILE"

  dast:
    name: DAST - ZAP baseline
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # The passive baseline only: it spiders the public site and reads the
      # answers, so it does not change data on the shared host.
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://${{ needs.deploy.outputs.host }}
          allow_issue_writing: false
          artifact_name: zap-baseline-report
          # -I: a WARN is reported, not fatal, as in deploy.yml (the app has
          # 3 known warnings). fail_action: a FAIL-level rule fails the job.
          cmd_options: '-I'
          fail_action: true

  smoke-load:
    name: Smoke load - k6
    needs: deploy
    # Demo workers call no model, so the test costs no money.
    if: needs.deploy.outputs.worker == 'demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1.2.2
      # 2 VUs for 30 s: proof that the release answers under load, not the
      # scaling test (PROFILE=full). Four accounts hold about 130 questions.
      - name: Run the smoke profile
        env:
          LUMEN_URL: https://${{ needs.deploy.outputs.host }}
        run: |
          k6 run -e LUMEN_URL="$LUMEN_URL" -e PROFILE=smoke -e POOL=4 \
            -e SUMMARY=k6-summary.json deploy/k8s/load/ask.js
      - name: Keep the k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-summary
          path: k6-summary.json
          if-no-files-found: ignore

  summary:
    needs: [sca, sast, deploy, dast, smoke-load]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Run summary
        env:
          HOST_NAME: ${{ needs.deploy.outputs.host }}
          SHA: ${{ github.sha }}
          SCA: ${{ needs.sca.result }}
          SAST: ${{ needs.sast.result }}
          # Empty when the deploy stopped before the scan ran.
          IMAGE_SCAN: ${{ needs.deploy.outputs.image_scan || 'skipped' }}
          DEPLOY: ${{ needs.deploy.result }}
          DAST: ${{ needs.dast.result }}
          SMOKE: ${{ needs.smoke-load.result }}
        run: |
          {
            echo '### Platform deploy'
            echo
            if [ -n "$HOST_NAME" ]; then
              echo "- Public URL: https://$HOST_NAME"
            else
              echo '- Public URL: none (the deploy did not run)'
            fi
            echo "- Image: \`lumen-next:$SHA\`"
            echo
            echo '| Stage | Result |'
            echo '|---|---|'
            echo "| SCA (npm audit) | $SCA |"
            echo "| SAST (CodeQL) | $SAST |"
            echo "| Image scan (Trivy) | $IMAGE_SCAN |"
            echo "| Deploy | $DEPLOY |"
            echo "| DAST (ZAP baseline) | $DAST |"
            echo "| Smoke load (k6) | $SMOKE |"
          } >> "$GITHUB_STEP_SUMMARY"
