{{- $rabbitPassword := include "lumen.coreSecret" (list $ "RABBITMQ_PASSWORD" 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: lumen-core
  labels:
    {{- include "lumen.labels" . | nindent 4 }}
  annotations:
    # Survive helm uninstall: the PVCs survive it too, and their data needs
    # the same passwords on the next install.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ include "lumen.coreSecret" (list $ "POSTGRES_PASSWORD" 32) | quote }}
  RABBITMQ_PASSWORD: {{ $rabbitPassword | quote }}
  # internalKey() in apps/server/src/services/shared/env.ts needs 32 or more.
  LUMEN_INTERNAL_KEY: {{ include "lumen.coreSecret" (list $ "LUMEN_INTERNAL_KEY" 48) | quote }}
  # For KEDA's TriggerAuthentication: the management API, whose queue count
  # includes unacknowledged messages, so a turn in hand still counts. KEDA
  # runs in its own namespace, so the host name is fully qualified. No app
  # container reads this key. Without a path, KEDA uses the vhost "/".
  KEDA_RABBITMQ_URL: {{ printf "http://lumen:%s@rabbitmq.%s.svc.cluster.local:15672" $rabbitPassword .Release.Namespace | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: lumen-extra
  labels:
    {{- include "lumen.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.extraSecrets }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
