<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene transitions, lumen</title>
    <script src="theme.js"></script>
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&amp;display=swap"
    />
    <link rel="stylesheet" href="raster.css" />
    <style>
      /* A bench for the scene's transitions. The three buttons move the camera
   between the shots the app uses; D changes the theme with the halftone
   wipe; opening the project carries its title into the bar. */
      .space,
      .veil {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .space {
        z-index: -1;
      }
      .veil {
        z-index: 50;
      }
      main {
        flex: 1;
        min-height: 0;
        padding: var(--s-5) var(--margin);
      }
      .shots {
        display: flex;
        gap: var(--s-2);
        margin-bottom: var(--s-5);
      }
      .shots .btn-sm[aria-pressed='true'] {
        background: var(--ink);
        color: var(--paper);
      }
      .mock {
        max-width: 36rem;
      }
      .mock-row {
        padding-block: var(--s-3);
        border-top: var(--rule-w) solid var(--rule-minor);
        cursor: pointer;
      }
      .mock-title {
        font-weight: var(--w-semi);
        view-transition-name: project-title;
        display: inline-block;
      }
      .mock-row p {
        color: var(--ink-2);
        font-size: var(--t-14);
      }
      .crumb-title {
        font-size: var(--t-14);
        font-weight: var(--w-semi);
        view-transition-name: project-title;
        display: inline-block;
      }
      .hint {
        margin-top: var(--s-5);
        font-size: 13px;
        color: var(--ink-2);
      }
      ::view-transition-group(project-title) {
        animation-duration: 520ms;
        animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*) {
          animation: none;
        }
      }
    </style>
  </head>
  <body data-view="home">
    <canvas class="space" data-space aria-hidden="true"></canvas>
    <canvas class="veil" data-veil aria-hidden="true" hidden></canvas>

    <header class="band bar">
      <a class="wordmark" href="scene.html">lumen</a>
      <div class="bar-end"><span data-crumb></span></div>
    </header>

    <main>
      <div class="shots" role="group" aria-label="Shot">
        <button type="button" class="btn-sm" data-go="landing" aria-pressed="true">Landing</button>
        <button type="button" class="btn-sm" data-go="home" aria-pressed="false">Home</button>
        <button type="button" class="btn-sm" data-go="session" aria-pressed="false">Session</button>
      </div>
      <div class="mock" data-list>
        <div class="mock-row" data-open>
          <span class="mock-title">Pop-stack fertility</span>
          <p>Open this to carry the title into the bar.</p>
        </div>
      </div>
      <p class="hint">D changes the theme from the cursor. G shows the grid.</p>
    </main>

    <script src="raster.js"></script>
    <script src="space.js"></script>
    <script>
      (function () {
        var root = document.documentElement;
        var buttons = document.querySelectorAll('[data-go]');
        function go(name) {
          buttons.forEach(function (b) {
            b.setAttribute('aria-pressed', String(b.dataset.go === name));
          });
          window.lumenSpace.shot(name);
        }
        buttons.forEach(function (b) {
          b.addEventListener('click', function () {
            go(b.dataset.go);
          });
        });
        root.setAttribute('data-shot', 'landing');

        // Opening a project: the title flies into the bar while the camera moves.
        var crumb = document.querySelector('[data-crumb]');
        var list = document.querySelector('[data-list]');
        function swap(open) {
          if (open) {
            crumb.innerHTML = '<span class="crumb-title">Pop-stack fertility</span>';
            list.hidden = true;
          } else {
            crumb.innerHTML = '';
            list.hidden = false;
          }
        }
        document.querySelector('[data-open]').addEventListener('click', function () {
          go('session');
          if (document.startViewTransition)
            document.startViewTransition(function () {
              swap(true);
            });
          else swap(true);
        });
        crumb.addEventListener('click', function () {
          go('home');
          if (document.startViewTransition)
            document.startViewTransition(function () {
              swap(false);
            });
          else swap(false);
        });

        // D runs the theme change through the halftone wipe, from the cursor.
        var at = { x: innerWidth / 2, y: innerHeight / 2 };
        addEventListener(
          'pointermove',
          function (e) {
            at.x = e.clientX;
            at.y = e.clientY;
          },
          { passive: true },
        );
        addEventListener(
          'keydown',
          function (e) {
            if (e.key !== 'd' && e.key !== 'D') return;
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            e.stopImmediatePropagation();
            window.lumenSpace.wipe(at.x, at.y, function () {
              var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
              try {
                localStorage.setItem('lumen-theme', next);
              } catch (err) {}
              root.setAttribute('data-theme', next);
            });
          },
          true,
        );
      })();
    </script>
  </body>
</html>
