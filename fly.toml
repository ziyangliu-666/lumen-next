# Staging on Fly.io: the image the Deploy workflow builds, on one machine that
# stops when idle. Postgres is the machine in deploy/fly/postgres.toml.
#
#   flyctl deploy --remote-only
app = "lumen-next-staging"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  LUMEN_PORT = "4000"
  LUMEN_ORIGIN = "https://lumen-next-staging.fly.dev"
  LUMEN_LOG_LEVEL = "info"
  IDENTITY_SESSION_LIFETIME_MS = "86400000"
  IDENTITY_INSECURE_COOKIES = "false"
  LUMEN_MODEL_PROVIDER = "openai"
  # One model, the cheapest, so the field shows "Auto" and no choice. Nano
  # gave wrong numbers on some computing questions that mini got right; put
  # gpt-4.1-mini here when the answers matter more than the cost.
  LUMEN_MODEL = "gpt-4.1-nano"
  LUMEN_MODELS = "gpt-4.1-nano"
  LUMEN_WORKER = "steering"
  LUMEN_COMPUTE_PROVIDER = "docker"
  # The sandbox: the same Python as the packages built into the app image
  # (Dockerfile, sandbox-lib stage), so readers can plot, solve and count.
  LUMEN_SANDBOX_IMAGE = "python:3.12-slim-bookworm"
  LUMEN_SANDBOX_LIBS = "/opt/sandbox-lib"
  LUMEN_VOLUME_ROOT = "/data/projects"
  LUMEN_DEMO_PACE_MS = "300"

# Project files (uploads, kept results, the sandboxes' scratch) on a volume:
# the machine's own disk is replaced on every deploy, and every project's
# files went with it. Created with
#   flyctl volumes create lumen_data --region sin --size 1
[mounts]
  source = "lumen_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB: the server, the Docker daemon, and one 512 MB sandbox at a time.
  memory = "1gb"
