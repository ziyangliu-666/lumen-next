<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lumen</title>
    <!-- The mark as a 6 by 6 halftone screen; the SVG switches to its light
         screen on a dark OS by itself. Safari's home screen takes the PNG. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Before any style: sets class "dark" from the OS or the stored choice,
         so the first paint already has the right theme. -->
    <script src="/theme-init.js"></script>
    <link rel="preload" href="/fonts/switzer.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
