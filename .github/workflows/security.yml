name: Security

# Security testing runs every sprint, on every pull request and weekly.
on:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  sca:
    name: SCA — dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  sast:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # a private repository needs this for the upload step
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      # Uploading to code scanning needs GitHub Code Security, which a private
      # repository does not have. The scan still runs on every pull request; the
      # SARIF report is kept as a run artifact instead.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: sarif-results
      - name: Keep the SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results
